# Minimal environment for PromptCASL.
# This is an independent, trimmed environment; it does not modify any shared env.
name: promptcasl

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - torch==2.1.2+cu121
      - transformers==4.36.2
      - tokenizers==0.15.2
      - peft==0.9.0
      - accelerate==0.28.0
      - pykeen==1.10.2
      - numpy==1.26.4
      - pandas==2.1.4
      - scipy==1.11.4
      - scikit-learn==1.3.2
      - tqdm==4.67.1
      - matplotlib==3.9.2
      - seaborn==0.13.2
      - PyYAML==6.0.2
      - wandb==0.16.6
      # KG-SLomics baseline (scripts/kgslomics)
      - torch_geometric==2.5.3
      - torch-scatter==2.0.9
      - torchdata==0.7.1
